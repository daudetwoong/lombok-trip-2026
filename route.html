<!-- 롬복 동선 지도 크게 보기 원본(자리표시를 build_extras.py가 자료 값으로 채워 route.local.html을 만듦, 배포 이름 route.html) -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>롬복 동선 지도</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
  :root{ --ink:#33312e; --paper:#fbf7ef; --card:#fff; --line:#e6ddcc; --accent:#c96f3f; --sea:#3d7a8c; --ok:#7f9a6d; --warn:#c9903f; --mute:#8a8377;
         --kta:#c96f3f; --gili:#2f8a8f; --sgg:#7d5aa6; --fly:#5f6f7a; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--paper)}
  body{font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--ink);line-height:1.5;overflow:hidden;-webkit-text-size-adjust:100%}
  a{color:var(--accent)}
  .rv{font-variant-numeric:tabular-nums;color:var(--mute);font-size:.92em;white-space:nowrap}
  .rv::before{content:"★";color:#e0a43a;margin-right:1px}
/* 동선 지도(번호 원·날짜 칩·층·순서 목록) 공통 모양 — build_extras.py가 lombok-plan·route 페이지에 끼워 넣어요 */
  .rchips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding:2px 0;min-width:0}
  .rchips::-webkit-scrollbar{display:none}
  .rchips button{flex:0 0 auto;min-height:34px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:0 10px;font:inherit;font-size:12.5px;font-weight:700;color:var(--mute);cursor:pointer;white-space:nowrap}
  .rchips button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .rlay{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;font-size:12.5px}
  .rlay label{display:inline-flex;align-items:center;gap:5px;cursor:pointer;min-height:28px}
  .rlay input{margin:0;width:16px;height:16px;accent-color:var(--accent)}
  .rleg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;color:var(--mute)}
  .rleg span{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
  .rleg i{display:inline-block;width:12px;height:12px;border-radius:50%;flex:0 0 12px}
  .rleg i.alt{background:#fff;border:2px solid var(--mute);width:10px;height:10px;flex-basis:10px}
  .rleg i.near{background:var(--mute);width:8px;height:8px;flex-basis:8px}
  .rleg i.ln{width:18px;height:0;border-radius:0;border-top:2px dashed #555;flex-basis:18px}
  .rnum{border:2px solid #fff;border-radius:50%;color:#fff;width:24px;height:24px;line-height:20px;text-align:center;font-weight:700;font-size:12px;box-shadow:0 1px 3px rgba(0,0,0,.45);box-sizing:border-box;cursor:pointer}
  .rkpin{background:#fff;border:2px solid var(--accent);border-radius:8px;color:var(--ink);font-weight:800;font-size:11px;line-height:16px;height:20px;padding:0 3px;white-space:nowrap;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.35);box-sizing:border-box}
  .rpop b{font-size:14px} .rpop .m{color:var(--mute);font-size:12px} .rpop a{font-weight:700}
  .rgrp{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden}
  .rgh{font-weight:800;font-size:13.5px;padding:6px 10px;background:#f3eee3}
  .rrow{display:grid;grid-template-columns:24px 40px 20px minmax(0,1fr);gap:6px;align-items:start;padding:7px 10px;border-top:1px dashed var(--line);cursor:pointer;font-size:13px;line-height:1.45}
  .rgh + .rrow{border-top:none}
  .rrow:hover,.rrow:focus{background:#faf6ee;outline:none}
  .rrow .rn{width:22px;height:22px;border-radius:50%;color:#fff;font-weight:700;font-size:11.5px;line-height:22px;text-align:center}
  .rrow .rt{font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink);padding-top:1px}
  .rrow .ri{padding-top:1px}
  .rrow .rb{min-width:0;overflow-wrap:anywhere}
  .rrow .rb small{display:block;color:var(--mute);font-size:12px}
  .rrow .ralt{font-size:12px;color:var(--mute);margin-top:2px}
  .rjp{margin:0 0 8px;padding-left:2px}
  .rjp button{min-height:30px;font-size:12px;font-weight:600}
  .rjp button.on{background:var(--sea);border-color:var(--sea)}
  .rrow.rtx{cursor:default}
  .rvh{font-variant-numeric:tabular-nums;color:var(--mute);font-size:.92em;white-space:nowrap}

  #rmap{position:fixed;inset:0;background:#e9eef2;z-index:0}
  .top{position:fixed;z-index:1000;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 8px) 10px 6px;background:var(--paper);border-bottom:1px solid var(--line);box-shadow:0 2px 8px rgba(0,0,0,.08)}
  .tt{display:flex;align-items:center;gap:8px;min-width:0}
  .tt h1{font-size:16px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tt a{flex:0 0 auto;font-size:12.5px;font-weight:700;text-decoration:none;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:5px 9px;color:var(--ink)}
  .path{display:flex;gap:6px;margin:6px 0}
  .path button{flex:1;min-height:34px;border:1px solid var(--line);background:var(--card);border-radius:10px;font:inherit;font-size:13px;font-weight:700;color:var(--mute);cursor:pointer}
  .path button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .sheet{position:fixed;z-index:1000;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);border-radius:16px 16px 0 0;box-shadow:0 -2px 10px rgba(0,0,0,.12);display:flex;flex-direction:column;height:40vh;height:40dvh;transition:height .2s}
  .sheet.min{height:118px} .sheet.max{height:78vh;height:78dvh}
  .sh{padding:6px 12px 6px;border-bottom:1px solid var(--line)}
  .grip{display:block;width:100%;border:none;background:none;padding:2px 0 4px;cursor:pointer;font:inherit;font-size:13px;font-weight:800;color:var(--ink);text-align:left}
  .grip::before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:#cfc6b4;margin:0 auto 5px}
  .grip small{font-weight:400;color:var(--mute);margin-left:6px}
  .sheet .rlay{margin:2px 0 4px}
  .sb{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 10px calc(env(safe-area-inset-bottom,0px) + 12px)}
  .note{font-size:12px;color:var(--mute);margin:4px 2px 8px}
  .leaflet-top{top:var(--toph,120px)}
  @media (max-width:759px){ .leaflet-bottom{bottom:var(--sheeth,40vh)} }
  @media (min-width:760px){
    .sheet{left:12px;right:auto;bottom:12px;width:410px;border-radius:16px;border:1px solid var(--line);height:calc(100vh - var(--toph,120px) - 24px)}
    .sheet.min{height:118px} .sheet.max{height:calc(100vh - var(--toph,120px) - 24px)}
  }
</style>
</head>
<body>
<div id="rmap" role="img" aria-label="롬복 동선 지도"></div>
<header class="top" id="top">
  <div class="tt"><h1>🧭 롬복 동선 지도</h1><a href="plan.html">← 자세한 일정</a></div>
  <div class="path" id="rpath"><button type="button" data-o="A">A · 바다 한 바퀴</button><button type="button" data-o="B">B · 느긋하게</button></div>
  <div class="rchips" id="rdays"></div>
</header>
<section class="sheet" id="sheet">
  <div class="sh">
    <button type="button" class="grip" id="grip">📋 가는 순서 목록 <small id="rcount"></small></button>
    <div class="rlay"><label><input type="checkbox" id="rnear"> 주변 맛집·놀거리 전부</label><label><input type="checkbox" id="rrank"> 꾸따 번화가 숙소 1~5위</label></div>
  </div>
  <div class="sb">
    <div class="rleg" id="rleg"></div>
    <div class="note">번호는 가는 순서예요. 일정 글에 "점심·저녁·밤"으로만 적힌 곳의 시각은 예시예요. 줄을 누르면 지도가 그곳으로 가요. 속 빈 작은 원은 "또는"으로 고를 수 있는 곳이에요. 11/24 자카르타 밤은 맨 앞 "🌃 11/24 자카르타" 탭에서 따로 봐요.</div>
    <div id="rlist"></div>
  </div>
</section>

  RKS.forEach(function(k){
    L.marker([k.lat,k.lng],{icon:L.divIcon({html:'<div class="rkpin">🏠'+k.n+'</div>',className:'',iconSize:[34,20],iconAnchor:[17,10]}),zIndexOffset:2000})
      .bindPopup('<div class="rpop"><b>🏠 꾸따 번화가 숙소 '+k.n+'위</b><br>'+rEsc(k.name)+'<br><span class="m">'+rEsc(k.title)+' · 1인 1박 '+rWon(k.ppn)+'원</span>'+(k.approx?'<br><span class="m">위치 대략</span>':'')+'<br><a class="rgo" href="'+rEsc(k.u)+'" target="_blank" rel="noopener">구글 지도에서 열기</a></div>').addTo(S.rank);});
  function vis(){if(S.day==='jkt')return jplan().rows.filter(function(r){return r.n;});return ROUTE[S.o].filter(function(e){return S.day==='all'||e.day===S.day;});}
  function pad(){return opt.pad?opt.pad():{tl:[34,36],br:[34,30]};}
  // 가까이 겹친 번호 원은 화면에서 살짝 비켜 놓아요(위치 점은 그대로)
  var RING=[[0,0]];[[18,8],[34,12]].forEach(function(r){for(var i=0;i<r[1];i++){var a=i/r[1]*2*Math.PI;RING.push([Math.round(r[0]*Math.cos(a)),Math.round(r[0]*Math.sin(a))]);}});
  function declutter(){
    var placed=[];
    S.mk.forEach(function(mk){var el=mk.getElement();if(!el)return;var p=m.latLngToContainerPoint(mk.getLatLng()),d=RING[0];
      for(var i=0;i<RING.length;i++){var x=p.x+RING[i][0],y=p.y+RING[i][1];
        if(placed.every(function(c){return Math.abs(c[0]-x)>=21||Math.abs(c[1]-y)>=21;})){d=RING[i];break;}}
      el.style.marginLeft=(d[0]-12)+'px';el.style.marginTop=(d[1]-12)+'px';placed.push([p.x+d[0],p.y+d[1]]);});
  }
  m.on('zoomend',declutter);
  function render(fit){
    S.main.clearLayers();S.mk=[];S.alts=[];var pts=vis(),line=[],b=[];
    pts.forEach(function(e){line.push([e.lat,e.lng]);b.push([e.lat,e.lng]);e.alt.forEach(function(a){b.push([a.lat,a.lng]);});});
    if(line.length>1)L.polyline(line,{color:'#555',weight:2,opacity:.6,dashArray:'6,6',className:'rline',interactive:false}).addTo(S.main);
    pts.forEach(function(e){e.alt.forEach(function(a){
      var c=L.circleMarker([a.lat,a.lng],{radius:6,color:rHex(a.z),weight:2.5,fillColor:'#fff',fillOpacity:1,className:'ralt'}).bindPopup(rAltPop(a,e)).addTo(S.main);
      c._re=a;c._of=e;S.alts.push(c);});});
    pts.forEach(function(e){
      var ic=L.divIcon({html:'<div class="rnum" data-n="'+e.n+'" style="background:'+rCol(e.z)+'">'+e.n+'</div>',className:'',iconSize:[24,24],iconAnchor:[12,12]});
      var mk=L.marker([e.lat,e.lng],{icon:ic,zIndexOffset:1000+e.n,title:e.n+'. '+e.name}).bindPopup(rPop(e)).addTo(S.main);
      mk._re=e;S.mk.push(mk);});
    if(fit&&b.length){var p=pad();m.fitBounds(b,{paddingTopLeft:p.tl,paddingBottomRight:p.br,maxZoom:15,animate:false});}
    declutter();
  }
  function chips(){
    var ds=[];ROUTE[S.o].forEach(function(e){if(ds.indexOf(e.day)<0)ds.push(e.day);});
    if(S.day!=='all'&&S.day!=='jkt'&&ds.indexOf(S.day)<0)S.day='all';
    q('days').innerHTML=['jkt','all'].concat(ds).map(function(d){return '<button type="button" data-day="'+d+'" class="'+(d===S.day?'on':'')+'">'+(d==='jkt'?'🌃 11/24 자카르타':d==='all'?'전체':d+' '+RWD[d])+'</button>';}).join('');
    var j=S.day==='jkt';JP.style.display=j?'':'none';
    JP.innerHTML=JKT.plans.map(function(p){return '<button type="button" data-plan="'+p.id+'" class="'+(p.id===S.jp?'on':'')+'">'+rEsc(p.title)+(p.id===JKT.pick?' · 추천':'')+'</button>';}).join('');
    LB.forEach(function(l){l[0].nodeValue=' '+l[j?2:1];});
  }
  function jlist(){
    var p=jplan(),h='<div class="rgrp"><div class="rgh">11/24 (화) 자카르타 · '+rEsc(p.title)+'</div>';
    p.rows.forEach(function(r){
      h+='<div class="rrow'+(r.n?'':' rtx')+'"'+(r.n?' data-n="'+r.n+'" tabindex="0"':'')+'><span class="rn" style="background:'+(r.n?rCol('jkt'):'#cfc6b4')+'">'+(r.n||'·')+'</span><span class="rt">'+rEsc(r.time)+'</span><span class="ri">'+(r.n?RIC[r.cat]:'🚕')+'</span>'+
        '<div class="rb">'+(r.n?'<b>'+rA(r,'rmain')+'</b> '+rScore(r)+(r.close?' <span class="m" style="color:var(--mute);font-size:12px">· 화·수 '+rEsc(r.close)+' 닫음</span>':''):'')+'<small>'+rEsc(r.memo)+'</small>'+
        (r.alt.length?'<div class="ralt">또는 '+r.alt.map(function(a){return rA(a,'raltl')+' '+rScore(a)+(a.close?' ('+rEsc(a.close)+' 닫음)':'');}).join(' · ')+'</div>':'')+'</div></div>';
    });
    h+='<div class="rrow rtx"><span></span><span></span><span class="ri">✅</span><div class="rb"><small>'+rEsc(p.fits)+'</small></div></div></div>';
    q('list').innerHTML=h;
  }
  function list(){
    if(S.day==='jkt')return jlist();
    var h='',cur='';
    vis().forEach(function(e){
      if(e.day!==cur){if(cur)h+='</div>';cur=e.day;h+='<div class="rgrp"><div class="rgh">'+e.day+' ('+RWD[e.day]+')</div>';}
      h+='<div class="rrow" data-n="'+e.n+'" tabindex="0"><span class="rn" style="background:'+rCol(e.z)+'">'+e.n+'</span><span class="rt">'+e.time+'</span><span class="ri" title="'+e.cat+'">'+RIC[e.cat]+'</span>'+
        '<div class="rb"><b>'+rA(e,'rmain')+'</b> '+rRv(e)+(e.approx?' <span class="m" style="color:var(--mute);font-size:12px">위치 대략</span>':'')+'<small>'+rEsc(e.memo)+'</small>'+
        (e.alt.length?'<div class="ralt">또는 '+e.alt.map(function(a){return rA(a,'raltl')+' '+rRv(a);}).join(' · ')+'</div>':'')+'</div></div>';
    });
    if(cur)h+='</div>';q('list').innerHTML=h;
  }
  function lay(){var j=S.day==='jkt',n=q('near').checked,k=q('rank').checked;
    [[S.near,!j&&n],[S.rank,!j&&k],[S.jv,j&&n],[S.jh,j&&k]].forEach(function(x){if(x[1])x[0].addTo(m);else m.removeLayer(x[0]);});}
  function all(fit){chips();render(fit);list();lay();if(opt.onChange)opt.onChange(S.o,S.day);}
  function focus(n){
    var mk=S.mk.filter(function(k){return k._re.n===n;})[0];if(!mk)return;
    if(opt.onFocus)opt.onFocus();
    m.setView(mk.getLatLng(),Math.max(m.getZoom(),14),{animate:false});declutter();mk.openPopup();
  }
  // 자카르타 짜임 고르기 줄(날짜 칩 바로 아래) · 층 이름표(롬복 글, 자카르타 글)
  var JP=document.createElement('div');JP.className='rchips rjp';JP.id=id+'jplan';q('days').insertAdjacentElement('afterend',JP);
  JP.addEventListener('click',function(ev){var b=ev.target.closest('[data-plan]');if(!b)return;S.jp=b.dataset.plan;all(true);});
  var LB=[[q('near').parentNode.lastChild,'',' 자카르타 가게 전부(구글 4.5 이상·후기 100 이상, '+JKT.venues.length+'곳)'],[q('rank').parentNode.lastChild,'','공항 호텔 '+JKT.hotels.length+'곳']];
  LB.forEach(function(l){l[1]=l[0].nodeValue.trim();l[2]=l[2].trim();});
  q('days').addEventListener('click',function(ev){var b=ev.target.closest('[data-day]');if(!b)return;S.day=b.dataset.day;all(true);});
  q('list').addEventListener('click',function(ev){if(ev.target.closest('a'))return;var r=ev.target.closest('.rrow');if(r)focus(+r.dataset.n);});
  q('list').addEventListener('keydown',function(ev){if(ev.key!=='Enter')return;var r=ev.target.closest('.rrow');if(r)focus(+r.dataset.n);});
  q('near').addEventListener('change',lay);
  q('rank').addEventListener('change',lay);
  q('leg').innerHTML=Object.keys(RZ).map(function(z){return '<span><i style="background:'+rCol(z)+'"></i>'+RZ[z][0]+'</span>';}).join('')+
    '<span><i class="ln"></i>가는 순서</span><span><i class="alt"></i>또는(고를 수 있는 곳)</span><span><i class="near"></i>주변 검증된 곳</span><span>🍽️맛집 ☕카페 🍺바 🏄놀거리 🏠숙소 🚐이동</span>';
  var api={map:m,S:S,pick:function(o,day){S.o=o;if(day)S.day=day;all(true);},refit:function(){render(true);}};
  window.RMAP=api;
  return api;
}

var TOP=document.getElementById('top'),SHEET=document.getElementById('sheet');
function setTop(){var r=document.documentElement.style;r.setProperty('--toph',TOP.offsetHeight+'px');r.setProperty('--sheeth',SHEET.offsetHeight+'px');}
setTop();
function pad(){
  var t=TOP.getBoundingClientRect().bottom,s=SHEET.getBoundingClientRect(),wide=innerWidth>=760;
  return {tl:[wide?s.right+24:24,t+30],br:[24,wide?24:Math.max(24,innerHeight-s.top+24)]};
}
var RM=RouteMap('r',{pad:pad,
  onFocus:function(){if(innerWidth<760&&SHEET.classList.contains('max')){SHEET.classList.remove('max');}},
  onChange:function(o,d){
    setTop();
    document.querySelectorAll('#rpath button').forEach(function(b){b.classList.toggle('on',b.dataset.o===o);});
    document.getElementById('rcount').textContent=(d==='all'?'전체':d==='jkt'?'11/24 자카르타':d)+' · '+RM_count()+'곳';
    try{history.replaceState(null,'','#'+o+(d==='all'?'':'-'+d));localStorage.setItem('lombok2opt',o==='B'?'1':'0');}catch(e){}
  }});
function RM_count(){return document.querySelectorAll('#rlist .rrow[data-n]').length;}
document.getElementById('rpath').addEventListener('click',function(e){var b=e.target.closest('[data-o]');if(b)RM.pick(b.dataset.o);});
document.getElementById('grip').addEventListener('click',function(){
  var c=SHEET.classList;if(c.contains('min')){c.remove('min');}else if(c.contains('max')){c.remove('max');c.add('min');}else{c.add('max');}
  setTimeout(function(){setTop();RM.map.invalidateSize();RM.refit();},230);
});
window.addEventListener('resize',function(){setTop();RM.map.invalidateSize();});
// 처음 길: 주소 끝 #B-11/27 같은 꼴 → 없으면 자세한 일정에서 고른 길
var h=decodeURIComponent(location.hash.slice(1)).split('-'),o0=h[0]==='B'||h[0]==='A'?h[0]:'A';
if(!h[0]){try{o0=localStorage.getItem('lombok2opt')==='1'?'B':'A';}catch(e){}}
RM.pick(o0,h[1]||'all');
</script>
